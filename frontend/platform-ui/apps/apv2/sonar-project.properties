sonar-project.properties
# must be unique in a given SonarQube instance
sonar.projectKey=ADA_Front-End_APV2

# --- optional properties ---
sonar.host.url=https://sonar.hello-ada.com/
sonar.projectName=Front-End-APV2

sonar.sources=src/

sonar.security.exclusions=**/docs/**,**/*.html,**/e2e/**,resources/assets/**,resources/locales/**

sonar.javascript.lcov.reportPaths=test-results/coverage/lcov.info

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,**/*.test.ts,**/tests/**,**/e2e/**,**/docs/**,**/test-results/**,**/playwright-report/**,**/scripts/**,**/docker/**,**/ssl/**,**/public/**,**/.idea/**,**/.cursor/**,**/.vscode/**,**/.sonarlint/**,**/CoverageReport/**,**/CoverageOutput/**
sonar.coverage.exclusions=**/*.spec.ts,**/*.test.ts,**/tests/**,**/e2e/**,**/mockData/**,**/*.d.ts,**/*.config.*,**/docs/**,**/test-results/**,**/playwright-report/**,**/scripts/**,**/public/**,**/CoverageReport/**,**/CoverageOutput/**

sonar.tests=tests/,e2e/
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts

sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=css:S4654
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.css
