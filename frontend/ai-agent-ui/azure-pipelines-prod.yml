trigger:
  branches:
    include:
      - prod
  paths:
    exclude:
      - "*.md"
      - "docs/**"

pr:
  branches:
    include:
      - prod

variables:
  GCP_PROJECT_ID: "ai-negotiation-494315"
  GCP_REGION: "northamerica-northeast2"
  AR_REPO: "calculum-prod"
  IMAGE_NAME: "calculum-ui"
  CLOUD_RUN_SERVICE: "calculum-ui-prod"
  IMAGE_URI: "$(GCP_REGION)-docker.pkg.dev/$(GCP_PROJECT_ID)/$(AR_REPO)/$(IMAGE_NAME)"

stages:
  # ─────────────────────────────────────────────
  # STAGE 1 — Type Check
  # ─────────────────────────────────────────────
  - stage: Test
    displayName: "Type Check"
    jobs:
      - job: TypeCheck
        displayName: "vue-tsc"
        pool:
          name: "self-hosted-mac"
        steps:
          - task: Bash@3
            displayName: "Install dependencies"
            inputs:
              targetType: "inline"
              script: npm ci

          - task: Bash@3
            displayName: "Type check (non-blocking)"
            inputs:
              targetType: "inline"
              script: npx vue-tsc -b --noEmit || true

  # ─────────────────────────────────────────────
  # STAGE 2 — Build & Push
  # ─────────────────────────────────────────────
  - stage: Build
    displayName: "Build & Push to Production Artifact Registry"
    dependsOn: Test
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    variables:
      - group: calculum-ui-production
    jobs:
      - job: BuildAndPush
        displayName: "Docker build → Production Artifact Registry"
        pool:
          name: "self-hosted-mac"
        steps:
          - task: Bash@3
            displayName: "Preflight: docker + free space"
            inputs:
              targetType: "inline"
              script: |
                set -e
                docker info >/dev/null 2>&1 || { echo "##vso[task.logissue type=error]Docker daemon not running on agent"; exit 1; }
                AVAIL_KB=$(df -k / | awk 'NR==2 {print $4}')
                if [ "$AVAIL_KB" -lt 15728640 ]; then
                  echo "Less than 15 GiB free — pruning old images (preserving build cache)"
                  docker image prune -a --filter "until=72h" --force || true
                  docker container prune --force || true
                fi
                df -h /

          - task: Bash@3
            displayName: "Authenticate to GCP"
            inputs:
              targetType: "inline"
              script: |
                echo "$(GCP_SA_KEY)" > /tmp/sa-key.json
                gcloud auth activate-service-account --key-file=/tmp/sa-key.json
                gcloud config set project $(GCP_PROJECT_ID)
                gcloud auth print-access-token \
                  | docker login -u oauth2accesstoken --password-stdin \
                    "$(GCP_REGION)-docker.pkg.dev"
            env:
              GCP_SA_KEY: $(GCP_SA_KEY)

          - task: Bash@3
            displayName: "Build Docker image"
            inputs:
              targetType: "inline"
              script: |
                set -euo pipefail
                docker pull "$(IMAGE_URI):latest" || true
                docker build \
                  --platform linux/amd64 \
                  --cache-from "$(IMAGE_URI):latest" \
                  --build-arg BUILD_MODE=production \
                  --build-arg VITE_AUTH_API_URL="$(VITE_AUTH_API_URL)" \
                  --build-arg VITE_NEGOTIATION_API_URL="$(VITE_NEGOTIATION_API_URL)" \
                  --build-arg VITE_NEGOTIATION_BACKEND_URL_WS="$(VITE_NEGOTIATION_BACKEND_URL_WS)" \
                  --build-arg VITE_INGESTION_API_URL="$(VITE_INGESTION_API_URL)" \
                  --build-arg VITE_SUPPORT_INGESTION_API_URL="$(VITE_SUPPORT_INGESTION_API_URL)" \
                  --build-arg VITE_SUPPORT_API_URL="$(VITE_SUPPORT_API_URL)" \
                  --build-arg VITE_SUPPORT_API_URL_WS="$(VITE_SUPPORT_API_URL_WS)" \
                  -t "$(IMAGE_URI):$(Build.BuildId)" \
                  -t "$(IMAGE_URI):latest" \
                  .

          - task: Bash@3
            displayName: "Push to Production Artifact Registry"
            inputs:
              targetType: "inline"
              script: |
                set -euo pipefail
                gcloud auth print-access-token \
                  | docker login -u oauth2accesstoken --password-stdin \
                    "$(GCP_REGION)-docker.pkg.dev"
                docker push "$(IMAGE_URI):$(Build.BuildId)"
                docker push "$(IMAGE_URI):latest"

          - task: Bash@3
            displayName: "Clean up SA key"
            condition: always()
            inputs:
              targetType: "inline"
              script: rm -f /tmp/sa-key.json

  # ─────────────────────────────────────────────
  # STAGE 3 — Deploy to Production
  # ─────────────────────────────────────────────
  - stage: DeployProduction
    displayName: "Deploy to Production"
    dependsOn: Build
    condition: succeeded()
    variables:
      - group: calculum-ui-production
    jobs:
      - deployment: DeployProduction
        displayName: "Cloud Run deploy → production"
        pool:
          name: "self-hosted-mac"
        environment: "production"
        strategy:
          runOnce:
            deploy:
              steps:
                - task: Bash@3
                  displayName: "Authenticate to GCP"
                  inputs:
                    targetType: "inline"
                    script: |
                      echo "$(GCP_SA_KEY)" > /tmp/sa-key.json
                      gcloud auth activate-service-account --key-file=/tmp/sa-key.json
                      gcloud config set project $(GCP_PROJECT_ID)
                  env:
                    GCP_SA_KEY: $(GCP_SA_KEY)

                - task: Bash@3
                  displayName: "Deploy to Cloud Run"
                  inputs:
                    targetType: "inline"
                    script: |
                      gcloud run deploy $(CLOUD_RUN_SERVICE) \
                        --project=$(GCP_PROJECT_ID) \
                        --image "$(IMAGE_URI):$(Build.BuildId)" \
                        --region $(GCP_REGION) \
                        --platform managed \
                        --allow-unauthenticated \
                        --port 8080 \
                        --memory 256Mi \
                        --cpu 1 \
                        --min-instances 1 \
                        --max-instances 10 \
                        --ingress=all \
                        --timeout 30 \
                        --concurrency 1000

                - task: Bash@3
                  displayName: "Grant public (allUsers) invoker access"
                  inputs:
                    targetType: "inline"
                    script: |
                      gcloud run services add-iam-policy-binding $(CLOUD_RUN_SERVICE) \
                        --region=$(GCP_REGION) \
                        --project=$(GCP_PROJECT_ID) \
                        --member="allUsers" \
                        --role="roles/run.invoker"

                - task: Bash@3
                  displayName: "Print production URL"
                  inputs:
                    targetType: "inline"
                    script: |
                      URL=$(gcloud run services describe $(CLOUD_RUN_SERVICE) \
                        --region $(GCP_REGION) \
                        --project $(GCP_PROJECT_ID) \
                        --format 'value(status.url)')
                      echo "##vso[task.setvariable variable=PRODUCTION_URL]$URL"
                      echo "Production deployed to: $URL"

                - task: Bash@3
                  displayName: "Health check"
                  inputs:
                    targetType: "inline"
                    script: |
                      sleep 10
                      curl -f "$(PRODUCTION_URL)/health" || exit 1

                - task: Bash@3
                  displayName: "Clean up SA key"
                  condition: always()
                  inputs:
                    targetType: "inline"
                    script: rm -f /tmp/sa-key.json
