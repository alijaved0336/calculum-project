[project]
name = "calculum-tokenizer"
version = "0.1.0"
description = "Vendored embedding tokenizer files — single source of truth across Calculum services"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
# uv sync  — installs everything below automatically
service = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Data files (tokenizer.json, vocab, merges, configs) live inside the package
# dir, so hatchling bundles them into the wheel automatically.
packages = ["src/calculum_tokenizer"]

[tool.uv]
default-groups = ["service"]

