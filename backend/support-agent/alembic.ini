# Migrations for THIS repo's own chat tables only (support_threads, support_messages).
# See migrations/env.py — it uses an isolated version table (support_alembic_version) so
# this repo's lineage/head never collides with the AI Negotiation (alembic_version) or
# ingestion (ingestion_alembic_version) lineages on the shared DB.
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
