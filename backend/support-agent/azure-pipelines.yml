# backend-support-agent → Cloud Run (modeled on the ingestion-support-agent pipeline).
# Query-time Video RAG support API. Stages: Test → Build & Push → Deploy.
#
# LIBRARY VARIABLE GROUP 'Backend-support-staging':
#   COLLECTION_VIDEO_CHUNKS, EMBED_DIMS, EMBED_MODEL, EMBEDDING_MODEL_BASE_URL,
#   EMBEDDING_MODEL_KEY, GCP_PROJECT_ID, GCP_STORAGE_BUCKET,
#   JWT_SECRET, LLM_API_KEY, LLM_BASE_URL, POSTGRES_DSN, QDRANT_HOST, QDRANT_PORT, QDRANT_USE_TLS,
#   GCP_SA_KEY, CORS_ALLOWED_ORIGINS,
#   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, SMTP_FROM, SUPPORT_EMAIL_TO  (SES escalation email)
#   AZURE_JWKS_URL, AZURE_B2C_ISSUER, AZURE_B2C_AUDIENCE  (Ada Bot / Azure B2C RS256 auth)
#   AZURE_JWT_LEEWAY_HOURS  (grace window added to the Azure token's exp claim so a child
#     service embedded under *.hello-ada.com doesn't 401 mid-session while Ada's own 24h
#     login is still silently refreshed on its own pages; 0 = strict, today's behavior.
#     Unset/empty resolves to "" and fails pydantic-settings int parsing at boot — must be
#     present in the group once wired here, even if left at 0.)
#   CORS_ALLOWED_ORIGINS = comma-separated frontend origin(s) the browser calls from, e.g.
#     "https://app.calculum.com,https://staging.calculum.com" (use "*" only for quick dev).
#   Mark these SECRET (lock icon): GCP_SA_KEY, EMBEDDING_MODEL_KEY, LLM_API_KEY, POSTGRES_DSN, JWT_SECRET,
#     SMTP_USER, SMTP_PASSWORD.
#   (The `- group:` name below MUST match your group's exact name/casing in all three stages.)
#
# SECRET MANAGER (NOT a group variable): the RUNTIME SA JSON lives in Secret Manager as the secret
#   named 'GCP_SERVICE_ACCOUNT_JSON' and is mounted via --set-secrets in the deploy step below. Reuse
#   the same secret that ingestion-support-agent already uses. RUNTIME_SA (calculum-storage-sa) needs
#   roles/secretmanager.secretAccessor on it (it already does for ingestion).
#
# TWO service-account identities:
#   • GCP_SA_KEY (group var) — JSON key of the DEPLOY SA used by gcloud/docker in CI. It needs
#     artifactregistry.writer + run.admin + iam.serviceAccountUser on RUNTIME_SA.
#   • GCP_SERVICE_ACCOUNT_JSON (Secret Manager secret) — JSON key of the RUNTIME SA (calculum-storage-sa),
#     mounted into Cloud Run via --set-secrets; the app reads it via from_service_account_info to sign
#     GCS URLs. Using Secret Manager (not inline --set-env-vars) avoids escaping the multi-KB JSON.
#
# Everything else uses app defaults (config.py): QDRANT_API_KEY="", CHAT_PATH,
# LLM_MODEL=Qwen3.6-35B-A3B, RERANKER_MODEL (pre-baked in the image), RAG_* thresholds,
# RAG_MAX_DOCUMENT_SOURCES=3, VIDEO_SIGNED_URL_TTL_SECONDS=3600, LOG_LEVEL=INFO.
# Escalation email (AWS SES over SMTP): SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASSWORD /
#   SMTP_FROM / SUPPORT_EMAIL_TO come from the group and are wired below. SMTP_HOST encodes the
#   AWS region (email-smtp.<region>.amazonaws.com); STARTTLS is implied by SMTP_PORT=587.
#   Any of SMTP_HOST/SMTP_FROM unset → escalation email is skipped, gracefully.
#   ⚠ To override another default (e.g. LLM_MODEL if your served model name differs), add it to
#     the group AND append |NAME=${NAME} to the --set-env-vars string below (+ an env: mapping).
#
# NOTES
#   • JWT_SECRET MUST equal calculum-tokenize's secret (tokens are verified locally).
#   • COLLECTION_VIDEO_CHUNKS / EMBEDDING_MODEL_BASE_URL / EMBED_MODEL / EMBED_DIMS MUST
#     match ingestion-support-agent so query vectors match the indexed vectors.
#   • Deployed --allow-unauthenticated: the browser frontend calls it directly and the
#     app enforces its own JWT (Cloud Run IAM would block browsers).

trigger:
  branches:
    include:
      - master
  paths:
    exclude:
      - "*.md"
      - "docs/**"

pr:
  branches:
    include:
      - master

variables:
  GCP_PROJECT_ID: "ai-negotiation-494315"
  GCP_REGION: "us-central1"
  AR_REPO: "core-calculum"                       # reuse the existing Artifact Registry repo
  IMAGE_NAME: "backend-support-agent"
  CLOUD_RUN_SERVICE: "backend-support-agent-api-staging"
  IMAGE_URI: "$(GCP_REGION)-docker.pkg.dev/$(GCP_PROJECT_ID)/$(AR_REPO)/$(IMAGE_NAME)"
  # The app runs AS this SA and signs GCS URLs with GCP_SERVICE_ACCOUNT_JSON → same identity.
  RUNTIME_SA: "calculum-storage-sa@ai-negotiation-494315.iam.gserviceaccount.com"

stages:
  # ─────────────────────────────────────────────
  # STAGE 1 — Lint & Test
  # ─────────────────────────────────────────────
  - stage: Test
    displayName: "Lint & Test"
    variables:
      - group: Backend-support-staging
    jobs:
      - job: RunTests
        displayName: "Run pytest"
        pool:
          name: "self-hosted-mac"
        steps:
          - script: |
              curl -LsSf https://astral.sh/uv/install.sh | sh
              export PATH="$HOME/.local/bin:$PATH"
              uv sync --frozen
            displayName: "Install dependencies"

          - script: |
              export PATH="$HOME/.local/bin:$PATH"
              uv run pytest -q -m "not integration"
            displayName: "Run unit tests"

  # ─────────────────────────────────────────────
  # STAGE 2 — Build & Push
  # ─────────────────────────────────────────────
  - stage: Build
    displayName: "Build & Push to Artifact Registry"
    dependsOn: Test
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    variables:
      - group: Backend-support-staging
    jobs:
      - job: BuildAndPush
        displayName: "Docker build → Artifact Registry"
        pool:
          name: "self-hosted-mac"
        steps:
          - task: Bash@3
            displayName: "Preflight: reclaim docker disk"
            inputs:
              targetType: "inline"
              script: |
                set -e
                docker info >/dev/null 2>&1 || { echo "##vso[task.logissue type=error]Docker daemon not running on agent"; exit 1; }
                df -h /
                USED=$(df / | awk 'NR==2 {gsub("%","",$5); print $5}')
                if [ "$USED" -ge 70 ]; then
                  echo "Disk ${USED}% used — pruning images + build cache older than 72h"
                  docker image prune -af --filter "until=72h" || true
                  docker builder prune -f  --filter "until=72h" || true
                  docker buildx prune -af --filter "until=72h" --builder calcbuilder 2>/dev/null || true
                  docker container prune -f || true
                fi
                USED=$(df / | awk 'NR==2 {gsub("%","",$5); print $5}')
                if [ "$USED" -ge 90 ]; then
                  echo "Still ${USED}% — aggressive full prune (next build starts cold)"
                  docker system prune -af  || true
                  docker builder prune -af || true
                  docker buildx prune -af --builder calcbuilder 2>/dev/null || true
                fi
                df -h /

          - task: Bash@3
            displayName: "Authenticate to GCP"
            inputs:
              targetType: "inline"
              script: |
                echo "$GCP_SA_KEY" > /tmp/sa-key.json
                gcloud auth activate-service-account --key-file=/tmp/sa-key.json
                gcloud config set project "$GCP_PROJECT_ID"
            env:
              GCP_SA_KEY: $(GCP_SA_KEY)
              GCP_PROJECT_ID: $(GCP_PROJECT_ID)

          - task: Bash@3
            displayName: "Build & push image (buildx + registry cache)"
            inputs:
              targetType: "inline"
              script: |
                set -euo pipefail
                gcloud auth print-access-token \
                  | docker login -u oauth2accesstoken --password-stdin "${GCP_REGION}-docker.pkg.dev"
                # Idempotent buildx builder (docker-container driver) so the `uv sync` layer can be
                # exported to / imported from the registry. This stops deps reinstalling on every
                # build after a local prune; mode=max also caches the reranker-model download layer.
                docker buildx version >/dev/null 2>&1 \
                  || { echo "##vso[task.logissue type=error]docker buildx not available on this agent — install Docker Buildx (ships with modern Docker / 'docker buildx install')"; exit 1; }
                docker buildx inspect calcbuilder >/dev/null 2>&1 \
                  || docker buildx create --name calcbuilder --driver docker-container --bootstrap
                docker buildx build \
                  --builder calcbuilder \
                  --platform linux/amd64 \
                  --cache-from type=registry,ref=${IMAGE_URI}:buildcache \
                  --cache-to   type=registry,ref=${IMAGE_URI}:buildcache,mode=max \
                  -t "${IMAGE_URI}:${BUILD_ID}" \
                  -t "${IMAGE_URI}:latest" \
                  --push \
                  -f Dockerfile .
            env:
              IMAGE_URI: $(IMAGE_URI)
              GCP_REGION: $(GCP_REGION)
              BUILD_ID: $(Build.BuildId)

          - task: Bash@3
            displayName: "Clean up SA key"
            condition: always()
            inputs:
              targetType: "inline"
              script: rm -f /tmp/sa-key.json

  # ─────────────────────────────────────────────
  # STAGE 3 — Deploy to Staging (master branch)
  # ─────────────────────────────────────────────
  - stage: DeployStaging
    displayName: "Deploy to Staging"
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'master'))
    variables:
      - group: Backend-support-staging
    jobs:
      - deployment: DeployStaging
        displayName: "Cloud Run deploy → staging"
        pool:
          name: "self-hosted-mac"
        environment: "staging"
        strategy:
          runOnce:
            deploy:
              steps:
                - task: Bash@3
                  displayName: "Authenticate to GCP"
                  inputs:
                    targetType: "inline"
                    script: |
                      echo "$GCP_SA_KEY" > /tmp/sa-key.json
                      gcloud auth activate-service-account --key-file=/tmp/sa-key.json
                      gcloud config set project "$GCP_PROJECT_ID"
                  env:
                    GCP_SA_KEY: $(GCP_SA_KEY)
                    GCP_PROJECT_ID: $(GCP_PROJECT_ID)

                - task: Bash@3
                  displayName: "Deploy to Cloud Run"
                  inputs:
                    targetType: "inline"
                    script: |
                      # ^|^ delimiter: '|' appears in none of the values (POSTGRES_DSN has '@'/':',
                      # CORS_ALLOWED_ORIGINS / SUPPORT_EMAIL_TO have ',', SES SMTP_PASSWORD is base64
                      # [A-Za-z0-9+/=] — none contain '|', so it stays a safe delimiter).
                      # GCP_SERVICE_ACCOUNT_JSON comes from Secret Manager via --set-secrets (robust —
                      # avoids inline-escaping the multi-KB SA JSON), exactly like ingestion-support-agent.
                      # --allow-unauthenticated: browser frontend reaches it; app enforces JWT.
                      # --timeout 3600: needed for the WS streaming endpoint to stay open.
                      # --session-affinity: pins a client's requests (incl. the WS upgrade and its
                      # follow-up traffic) to the same instance. Without it, on a service with more
                      # than one possible instance (min/max-instances below), a WS upgrade attempt
                      # can be rejected by the edge before reaching the container — matches
                      # core-calculum-api's infra/cloudrun-service.yaml, whose WS works.
                      gcloud run deploy "$CLOUD_RUN_SERVICE" \
                        --image "${IMAGE_URI}:${BUILD_ID}" \
                        --region "$GCP_REGION" \
                        --platform managed \
                        --service-account "$RUNTIME_SA" \
                        --allow-unauthenticated \
                        --ingress all \
                        --port 8080 \
                        --memory 2Gi \
                        --cpu 2 \
                        --min-instances 1 \
                        --max-instances 4 \
                        --timeout 3600 \
                        --concurrency 80 \
                        --cpu-boost \
                        --session-affinity \
                        --set-env-vars="^|^COLLECTION_VIDEO_CHUNKS=${COLLECTION_VIDEO_CHUNKS}|QDRANT_HOST=${QDRANT_HOST}|QDRANT_PORT=${QDRANT_PORT}|QDRANT_USE_TLS=${QDRANT_USE_TLS}|EMBEDDING_MODEL_BASE_URL=${EMBEDDING_MODEL_BASE_URL}|EMBEDDING_MODEL_KEY=${EMBEDDING_MODEL_KEY}|EMBED_MODEL=${EMBED_MODEL}|EMBED_DIMS=${EMBED_DIMS}|LLM_BASE_URL=${LLM_BASE_URL}|LLM_API_KEY=${LLM_API_KEY}|GCP_STORAGE_BUCKET=${GCP_STORAGE_BUCKET}|POSTGRES_DSN=${POSTGRES_DSN}|JWT_SECRET=${JWT_SECRET}|CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}|SMTP_HOST=${SMTP_HOST}|SMTP_PORT=${SMTP_PORT}|SMTP_USER=${SMTP_USER}|SMTP_PASSWORD=${SMTP_PASSWORD}|SMTP_FROM=${SMTP_FROM}|SUPPORT_EMAIL_TO=${SUPPORT_EMAIL_TO}|AZURE_JWKS_URL=${AZURE_JWKS_URL}|AZURE_B2C_ISSUER=${AZURE_B2C_ISSUER}|AZURE_B2C_AUDIENCE=${AZURE_B2C_AUDIENCE}|AZURE_JWT_LEEWAY_HOURS=${AZURE_JWT_LEEWAY_HOURS}" \
                        --set-secrets="GCP_SERVICE_ACCOUNT_JSON=GCP_SERVICE_ACCOUNT_JSON:latest"
                  env:
                    CLOUD_RUN_SERVICE: $(CLOUD_RUN_SERVICE)
                    IMAGE_URI: $(IMAGE_URI)
                    BUILD_ID: $(Build.BuildId)
                    GCP_REGION: $(GCP_REGION)
                    RUNTIME_SA: $(RUNTIME_SA)
                    COLLECTION_VIDEO_CHUNKS: $(COLLECTION_VIDEO_CHUNKS)
                    QDRANT_HOST: $(QDRANT_HOST)
                    QDRANT_PORT: $(QDRANT_PORT)
                    QDRANT_USE_TLS: $(QDRANT_USE_TLS)
                    EMBEDDING_MODEL_BASE_URL: $(EMBEDDING_MODEL_BASE_URL)
                    EMBEDDING_MODEL_KEY: $(EMBEDDING_MODEL_KEY)
                    EMBED_MODEL: $(EMBED_MODEL)
                    EMBED_DIMS: $(EMBED_DIMS)
                    LLM_BASE_URL: $(LLM_BASE_URL)
                    LLM_API_KEY: $(LLM_API_KEY)
                    GCP_STORAGE_BUCKET: $(GCP_STORAGE_BUCKET)
                    POSTGRES_DSN: $(POSTGRES_DSN)
                    JWT_SECRET: $(JWT_SECRET)
                    CORS_ALLOWED_ORIGINS: $(CORS_ALLOWED_ORIGINS)
                    SMTP_HOST: $(SMTP_HOST)
                    SMTP_PORT: $(SMTP_PORT)
                    SMTP_USER: $(SMTP_USER)
                    SMTP_PASSWORD: $(SMTP_PASSWORD)
                    SMTP_FROM: $(SMTP_FROM)
                    SUPPORT_EMAIL_TO: $(SUPPORT_EMAIL_TO)
                    AZURE_JWKS_URL: $(AZURE_JWKS_URL)
                    AZURE_B2C_ISSUER: $(AZURE_B2C_ISSUER)
                    AZURE_B2C_AUDIENCE: $(AZURE_B2C_AUDIENCE)
                    AZURE_JWT_LEEWAY_HOURS: $(AZURE_JWT_LEEWAY_HOURS)

                - task: Bash@3
                  displayName: "Print staging URL"
                  inputs:
                    targetType: "inline"
                    script: |
                      URL=$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
                        --region "$GCP_REGION" --format='value(status.url)')
                      echo "##vso[task.setvariable variable=STAGING_URL]$URL"
                      echo "Staging deployed to: $URL"
                  env:
                    CLOUD_RUN_SERVICE: $(CLOUD_RUN_SERVICE)
                    GCP_REGION: $(GCP_REGION)

                - task: Bash@3
                  displayName: "Clean up SA key"
                  condition: always()
                  inputs:
                    targetType: "inline"
                    script: rm -f /tmp/sa-key.json
