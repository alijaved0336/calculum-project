version: "3.9"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: calculum
      POSTGRES_USER: calculum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-calculum}
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calculum -d calculum"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST / gRPC (HTTP/2)
      - "6334:6334"   # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage:z
    environment:
      # Uncomment to enable API key auth on self-hosted Qdrant
      # QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY}"
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
