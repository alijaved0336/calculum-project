[project]
name = "ai-negotiation"
version = "0.1.0"
description = "AI-powered procurement negotiation service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.4.0",
    "psutil>=5.9.8",
    "qdrant-client>=1.9.1",
    "torch>=2.0.0",
    "sentence-transformers>=3.0.1",
    "einops>=0.7.0",
    "rank-bm25>=0.2.2",
    "pypdf>=4.2.0",
    "python-docx>=1.1.2",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "weasyprint>=68.0",
    "google-cloud-storage>=3.1.0",
    "langgraph>=0.2.45",
    "langchain>=0.3.7",
    "langchain-ollama>=0.2.1",
    "pyjwt>=2.12.1",
    "websockets>=16.0",
    "alembic>=1.18.4",
    "sqlalchemy[asyncio]>=2.0.50",
    "asyncpg>=0.31.0",
    "passlib[bcrypt]>=1.7.4",
    "ragas>=0.2.0",
    "datasets>=2.14.0",
    "langfuse>=2.0.0",
    "langchain-openai>=0.2.0",
    "langchain-google-vertexai>=2.0.0",
    "pandas>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Force CPU-only PyTorch — this service runs on Cloud Run (no GPU).
# GPU inference runs on the separate Ollama server, not here.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
