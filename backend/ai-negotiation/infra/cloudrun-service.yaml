apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: core-calculum-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "false"   # always-on CPU (needed for background LLM work)
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: cloudrun-runtime@ai-negotiation-494315.iam.gserviceaccount.com
      containers:
        - image: us-central1-docker.pkg.dev/ai-negotiation-494315/core-calculum/api:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 4Gi
              cpu: "2"
          env:
            # All secrets pulled from Secret Manager at runtime
            - name: LLM_MODEL
              valueFrom:
                secretKeyRef:
                  name: LLM_MODEL
                  key: latest
            - name: OLLAMA_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: OLLAMA_BASE_URL
                  key: latest
            - name: OLLAMA_HOST
              valueFrom:
                secretKeyRef:
                  name: OLLAMA_HOST
                  key: latest
            - name: QDRANT_HOST
              valueFrom:
                secretKeyRef:
                  name: QDRANT_HOST
                  key: latest
            - name: QDRANT_PORT
              valueFrom:
                secretKeyRef:
                  name: QDRANT_PORT
                  key: latest
            - name: EMBED_MODEL
              valueFrom:
                secretKeyRef:
                  name: EMBED_MODEL
                  key: latest
            - name: EMBED_DIMS
              value: "768"
            - name: RERANKER_MODEL
              valueFrom:
                secretKeyRef:
                  name: RERANKER_MODEL
                  key: latest
            - name: CALCULUM_API_URL
              valueFrom:
                secretKeyRef:
                  name: CALCULUM_API_URL
                  key: latest
            - name: CALCULUM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: CALCULUM_API_KEY
                  key: latest
          livenessProbe:
            httpGet:
              path: /health
            initialDelaySeconds: 30
            periodSeconds: 30
          startupProbe:
            httpGet:
              path: /health
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
