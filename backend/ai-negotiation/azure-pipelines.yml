trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - "*.md"
      - "docs/**"

pr:
  branches:
    include:
      - main

variables:
  GCP_PROJECT_ID: "ai-negotiation-494315"
  GCP_REGION: "us-central1"
  AR_REPO: "core-calculum"
  IMAGE_NAME: "api"
  CLOUD_RUN_SERVICE: "core-calculum-api-staging"
  IMAGE_URI: "$(GCP_REGION)-docker.pkg.dev/$(GCP_PROJECT_ID)/$(AR_REPO)/$(IMAGE_NAME)"

stages:
  # ─────────────────────────────────────────────
  # STAGE 1 — Lint & Test
  # ─────────────────────────────────────────────
  - stage: Test
    displayName: "Lint & Test"
    jobs:
      - job: RunTests
        displayName: "Run pytest"
        pool:
          name: "self-hosted-mac"
        steps:
          - script: |
              curl -LsSf https://astral.sh/uv/install.sh | sh
              export PATH="$HOME/.local/bin:$PATH"
              uv sync --frozen
            displayName: "Install dependencies"

          - script: |
              export PATH="$HOME/.local/bin:$PATH"
              uv run pytest tests/ -v --tb=short || true
            displayName: "Run tests (non-blocking)"

  # ─────────────────────────────────────────────
  # STAGE 2 — Build & Push
  # ─────────────────────────────────────────────
  - stage: Build
    displayName: "Build & Push to Artifact Registry"
    dependsOn: Test
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    variables:
      - group: ai-negotiation-staging
    jobs:
      - job: BuildAndPush
        displayName: "Docker build → Staging Artifact Registry"
        pool:
          name: "self-hosted-mac"
        steps:
          - task: Bash@3
            displayName: "Preflight: docker + free space"
            inputs:
              targetType: "inline"
              script: |
                set -e
                docker info >/dev/null 2>&1 || { echo "##vso[task.logissue type=error]Docker daemon not running on agent"; exit 1; }
                AVAIL_KB=$(df -k / | awk 'NR==2 {print $4}')
                if [ "$AVAIL_KB" -lt 15728640 ]; then
                  echo "Less than 15 GiB free — pruning old images (preserving build cache)"
                  docker image prune -a --filter "until=72h" --force || true
                  docker container prune --force || true
                fi
                df -h /

          - task: Bash@3
            displayName: "Authenticate to GCP"
            inputs:
              targetType: "inline"
              script: |
                echo "$(GCP_SA_KEY)" > /tmp/sa-key.json
                gcloud auth activate-service-account --key-file=/tmp/sa-key.json
                gcloud config set project $(GCP_PROJECT_ID)
            env:
              GCP_SA_KEY: $(GCP_SA_KEY)

          - task: Bash@3
            displayName: "Build base image (content-addressed by uv.lock hash)"
            inputs:
              targetType: "inline"
              script: |
                set -euo pipefail
                LOCK_HASH=$(shasum -a 256 uv.lock | cut -c1-16)
                BASE_TAG="$(IMAGE_URI)-base:${LOCK_HASH}"
                echo "uv.lock hash: ${LOCK_HASH}"

                if docker pull "${BASE_TAG}" 2>/dev/null; then
                  echo "Cache hit — reusing ${BASE_TAG}"
                else
                  echo "Cache miss — building base image..."
                  docker pull "$(IMAGE_URI)-base:latest" || true
                  docker build \
                    --platform linux/amd64 \
                    --cache-from "$(IMAGE_URI)-base:latest" \
                    -t "${BASE_TAG}" \
                    -t "$(IMAGE_URI)-base:latest" \
                    -f Dockerfile.base .
                  docker push "${BASE_TAG}"
                  docker push "$(IMAGE_URI)-base:latest"
                fi

                echo "##vso[task.setvariable variable=BASE_TAG]${BASE_TAG}"

          - task: Bash@3
            displayName: "Build Docker image"
            inputs:
              targetType: "inline"
              script: |
                set -euo pipefail
                docker build \
                  --platform linux/amd64 \
                  --build-arg BASE_IMAGE="$(BASE_TAG)" \
                  -t "$(IMAGE_URI):$(Build.BuildId)" \
                  -t "$(IMAGE_URI):latest" \
                  -f Dockerfile .

          - task: Bash@3
            displayName: "Push to Artifact Registry"
            inputs:
              targetType: "inline"
              script: |
                set -euo pipefail
                gcloud auth print-access-token \
                  | docker login -u oauth2accesstoken --password-stdin \
                    "$(GCP_REGION)-docker.pkg.dev"
                docker push "$(IMAGE_URI):$(Build.BuildId)"
                docker push "$(IMAGE_URI):latest"

          - task: Bash@3
            displayName: "Clean up SA key"
            condition: always()
            inputs:
              targetType: "inline"
              script: rm -f /tmp/sa-key.json

  # ─────────────────────────────────────────────
  # STAGE 3 — Deploy to Staging
  # ─────────────────────────────────────────────
  - stage: DeployStaging
    displayName: "Deploy to Staging"
    dependsOn: Build
    condition: succeeded()
    variables:
      - group: ai-negotiation-staging
    jobs:
      - deployment: DeployStaging
        displayName: "Cloud Run deploy → staging"
        pool:
          name: "self-hosted-mac"
        environment: "staging"
        strategy:
          runOnce:
            deploy:
              steps:
                - task: Bash@3
                  displayName: "Authenticate to GCP"
                  inputs:
                    targetType: "inline"
                    script: |
                      echo "$(GCP_SA_KEY)" > /tmp/sa-key.json
                      gcloud auth activate-service-account --key-file=/tmp/sa-key.json
                      gcloud config set project $(GCP_PROJECT_ID)
                  env:
                    GCP_SA_KEY: $(GCP_SA_KEY)

                - task: Bash@3
                  displayName: "Deploy to Cloud Run"
                  inputs:
                    targetType: "inline"
                    script: |
                      gcloud run deploy $(CLOUD_RUN_SERVICE) \
                        --image "$(IMAGE_URI):$(Build.BuildId)" \
                        --region $(GCP_REGION) \
                        --platform managed \
                        --allow-unauthenticated \
                        --port 8080 \
                        --memory 4Gi \
                        --cpu 2 \
                        --min-instances 1 \
                        --max-instances 10 \
                        --set-env-vars="^|^LLM_BASE_URL=$(LLM_BASE_URL)|LLM_API_KEY=$(LLM_API_KEY)|LLM_MODEL=$(LLM_MODEL)|EMBEDDING_MODEL_BASE_URL=$(EMBEDDING_MODEL_BASE_URL)|EMBEDDING_MODEL_KEY=$(EMBEDDING_MODEL_KEY)|EMBED_MODEL=$(EMBED_MODEL)|EMBED_DIMS=$(EMBED_DIMS)|QDRANT_HOST=$(QDRANT_HOST)|QDRANT_PORT=$(QDRANT_PORT)|QDRANT_USE_TLS=$(QDRANT_USE_TLS)|COLLECTION_KNOWLEDGE_BASE=$(COLLECTION_KNOWLEDGE_BASE)|JWT_SECRET=$(JWT_SECRET)|JWT_EXPIRY_HOURS=$(JWT_EXPIRY_HOURS)|PASSWORD_PEPPER=$(PASSWORD_PEPPER)|POSTGRES_HOST=$(POSTGRES_HOST)|POSTGRES_PORT=$(POSTGRES_PORT)|POSTGRES_DB=$(POSTGRES_DB)|POSTGRES_USER=$(POSTGRES_USER)|POSTGRES_PASSWORD=$(POSTGRES_PASSWORD)|POSTGRES_DSN=$(POSTGRES_DSN)|CALCULUM_API_URL=$(CALCULUM_API_URL)|CALCULUM_API_KEY=$(CALCULUM_API_KEY)|GCP_PROJECT_ID=$(GCP_PROJECT_ID)|GCP_STORAGE_BUCKET=$(GCP_STORAGE_BUCKET)|GCP_STORAGE_PREFIX=$(GCP_STORAGE_PREFIX)|AZURE_JWKS_URL=$(AZURE_JWKS_URL)|AZURE_B2C_ISSUER=$(AZURE_B2C_ISSUER)|AZURE_B2C_AUDIENCE=$(AZURE_B2C_AUDIENCE)|AZURE_JWT_LEEWAY_HOURS=$(AZURE_JWT_LEEWAY_HOURS)|CORS_ALLOWED_ORIGINS=$(CORS_ALLOWED_ORIGINS)" \
                        --set-secrets="GCP_SERVICE_ACCOUNT_JSON=GCP_SERVICE_ACCOUNT_JSON:latest" \
                        --timeout 300 \
                        --concurrency 80 \
                        --cpu-boost

                - task: Bash@3
                  displayName: "Print staging URL"
                  inputs:
                    targetType: "inline"
                    script: |
                      URL=$(gcloud run services describe $(CLOUD_RUN_SERVICE) \
                        --region $(GCP_REGION) \
                        --format='value(status.url)')
                      echo "##vso[task.setvariable variable=STAGING_URL]$URL"
                      echo "Staging deployed to: $URL"

                - task: Bash@3
                  displayName: "Health check"
                  inputs:
                    targetType: "inline"
                    script: |
                      sleep 10
                      curl -f "$(STAGING_URL)/health" || exit 1

                - task: Bash@3
                  displayName: "Clean up SA key"
                  condition: always()
                  inputs:
                    targetType: "inline"
                    script: rm -f /tmp/sa-key.json
